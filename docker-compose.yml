services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: goatquote-postgres
    environment:
      POSTGRES_USER: goatquote
      POSTGRES_PASSWORD: goatquote
      POSTGRES_DB: goatquote
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: